name: CI

on:
  push:
    branches: [ main, master, 'probe/**' ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.mln }} / ${{ matrix.feature }} / ${{ matrix.slint_backend }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Each arm states the outcome it expects, and the smoke step fails when
      # the observation disagrees. An all-green run therefore means the whole
      # causal story holds on this runner, and a red arm names the place where
      # it broke.
      #
      # The story under test:
      #   * maplibre_native 0.8.3 flipped the default Linux OpenGL context from
      #     GLX to EGL. 0.8.2 is the last version that builds the GLX headless
      #     backend, and the `glx` feature restores it from 0.8.3 onwards.
      #   * MapLibre's EGL headless backend cannot make its context current
      #     while the Slint toolkit holds a GL context on the same process, so
      #     the EGL arms abort with "Switching OpenGL context failed".
      #   * The software renderer never takes a host GL context, so it passes
      #     even on an EGL build. Pinning one renderer hides half of this.
      matrix:
        include:
          - { mln: "0.8.2", feature: "opengl", slint_backend: "winit-femtovg",  egl: "no",  expect: "pass" }
          - { mln: "0.8.7", feature: "opengl", slint_backend: "winit-femtovg",  egl: "yes", expect: "reproduce" }
          - { mln: "0.9.1", feature: "opengl", slint_backend: "winit-femtovg",  egl: "yes", expect: "reproduce" }
          - { mln: "0.9.1", feature: "glx",    slint_backend: "winit-femtovg",  egl: "no",  expect: "pass" }
          - { mln: "0.9.1", feature: "opengl", slint_backend: "winit-software", egl: "yes", expect: "pass" }
    steps:
      - uses: actions/checkout@v6

      - name: Install Protocol Buffers Compiler
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            cmake \
            g++ \
            git \
            glslang-dev \
            glslang-tools \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libglfw3-dev \
            libgtk-3-dev \
            libicu-dev \
            libjpeg-turbo8-dev \
            libpng-dev \
            pkg-config \
            libssl-dev \
            libuv1-dev \
            libwebp-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            spirv-tools
          # The EGL headless backend needs <EGL/egl.h> and -lEGL. The GLX one
          # needs neither, which is why this workflow never asked for them.
          sudo apt-get install -y \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            mesa-utils \
            xvfb

      - name: Pin maplibre_native ${{ matrix.mln }} with feature ${{ matrix.feature }}
        working-directory: ./rust
        run: |
          want_slint=$(grep -A1 '^name = "slint"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          echo "slint currently locked at ${want_slint}"

          # An exact requirement, not a caret one. `cargo update --precise` does
          # not hold when the locked version falls outside the requirement the
          # manifest was just given: cargo re-resolves to the newest compatible
          # release instead, so a bare "0.8.2" silently lands on 0.8.7.
          sed -i "s|maplibre_native = { version = \"[^\"]*\"|maplibre_native = { version = \"=${{ matrix.mln }}\"|g" Cargo.toml
          sed -i "s|features = \[\"opengl\"\] }|features = [\"${{ matrix.feature }}\"] }|" Cargo.toml
          cargo update -p maplibre_native --precise ${{ matrix.mln }}
          grep -n 'maplibre_native = ' Cargo.toml

          got=$(grep -A1 '^name = "maplibre_native"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          if [ "$got" != "${{ matrix.mln }}" ]; then
            echo "lock pinned maplibre_native $got, wanted ${{ matrix.mln }}"
            exit 1
          fi
          got_slint=$(grep -A1 '^name = "slint"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          if [ "$got_slint" != "$want_slint" ]; then
            echo "slint moved $want_slint -> $got_slint; this is no longer a one-variable change"
            exit 1
          fi
          echo "pinned maplibre_native $got, slint held at $got_slint"

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-registry-${{ matrix.mln }}-${{ matrix.feature }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: rust/target
          key: ${{ runner.os }}-target-${{ matrix.mln }}-${{ matrix.feature }}

      - name: Build
        env:
          MLN_CMAKE_CXX_LAUNCHER: ccache
        run: cargo build --verbose
        working-directory: ./rust

      - name: Assert the expected headless backend was compiled
        working-directory: ./rust
        run: |
          cache=$(find target/debug/build -name CMakeCache.txt -path '*maplibre_native*' | head -1)
          echo "CMakeCache: $cache"
          grep -E '^MLN_WITH_(OPENGL|EGL|X11):' "$cache"
          egl=$(sed -n 's/^MLN_WITH_EGL:BOOL=\(.*\)$/\1/p' "$cache")
          case "${{ matrix.egl }}:$egl" in
            yes:ON|no:OFF) echo "headless backend matches the arm (EGL=$egl)" ;;
            *) echo "arm expects EGL=${{ matrix.egl }} but cmake configured EGL=$egl"; exit 1 ;;
          esac
          ldd target/debug/maplibre_native_slint | grep -Ei 'libEGL|libGL\.' || true

      - name: Run tests
        env:
          MLN_CMAKE_CXX_LAUNCHER: ccache
        run: cargo test --verbose
        working-directory: ./rust

      - name: Report the host GL stack
        run: glxinfo -B 2>&1 | head -20 || true

      - name: GUI smoke test under Xvfb
        working-directory: ./rust
        env:
          SLINT_BACKEND: ${{ matrix.slint_backend }}
        run: |
          set +e
          xvfb-run -a -s "-screen 0 1024x768x24 -ac +extension GLX +render -noreset" \
            bash ../.github/scripts/gui_smoke.sh > smoke.txt 2>&1
          code=$?
          set -e
          cat smoke.txt
          echo "::group::gui.log"
          cat gui.log || true
          echo "::endgroup::"

          if grep -q 'Switching OpenGL context failed' gui.log; then
            observed=reproduce
          elif [ "$code" -eq 0 ] && grep -q 'Rendering Stats' gui.log; then
            observed=pass
          else
            observed="other (gui_smoke exit $code)"
          fi
          echo "expected=${{ matrix.expect }} observed=$observed"

          # The mapped-object list above is diagnostic only. It cannot attribute
          # libEGL to the toolkit rather than to MapLibre, because an EGL build
          # links -lEGL itself, so it must not gate the verdict.

          [ "$observed" = "${{ matrix.expect }}" ] || { echo "prediction violated"; exit 1; }
          echo "as predicted"

      - name: Upload GUI log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-log-${{ matrix.mln }}-${{ matrix.feature }}-${{ matrix.slint_backend }}
          path: |
            rust/gui.log
            rust/smoke.txt
          retention-days: 5
